<!doctype html>
<html class="h-full" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Career Navigator</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        "darkMode": "class",
        "theme": {
          "extend": {
            "colors": {
              "primary": "#00685f",
              "inverse-on-surface": "#edf2f0",
              "on-error-container": "#93000a",
              "on-tertiary-fixed-variant": "#773215",
              "on-secondary-fixed-variant": "#414754",
              "error": "#ba1a1a",
              "on-secondary": "#ffffff",
              "on-surface": "#171d1c",
              "on-tertiary-container": "#fffbff",
              "background": "#f5faf8",
              "surface-variant": "#dee4e1",
              "on-primary": "#ffffff",
              "on-background": "#171d1c",
              "tertiary-fixed": "#ffdbce",
              "outline-variant": "#bcc9c6",
              "secondary-fixed": "#dde2f3",
              "surface-container": "#eaefed",
              "secondary-container": "#dde2f3",
              "surface-tint": "#006a61",
              "tertiary-fixed-dim": "#ffb59a",
              "on-surface-variant": "#3d4947",
              "on-tertiary": "#ffffff",
              "secondary": "#585e6c",
              "on-error": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "surface-dim": "#d6dbd9",
              "surface-container-high": "#e4e9e7",
              "surface": "#f5faf8",
              "on-primary-container": "#f4fffc",
              "primary-container": "#008378",
              "surface-container-low": "#f0f5f2",
              "surface-bright": "#f5faf8",
              "on-primary-fixed": "#00201d",
              "on-tertiary-fixed": "#370e00",
              "tertiary-container": "#b05e3d",
              "inverse-primary": "#6bd8cb",
              "primary-fixed": "#89f5e7",
              "secondary-fixed-dim": "#c1c6d6",
              "on-secondary-fixed": "#161c27",
              "inverse-surface": "#2c3130",
              "on-primary-fixed-variant": "#005049",
              "on-secondary-container": "#5e6472",
              "tertiary": "#924628",
              "primary-fixed-dim": "#6bd8cb",
              "error-container": "#ffdad6",
              "surface-container-highest": "#dee4e1",
              "outline": "#6d7a77"
            },
            "borderRadius": {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
            "spacing": {
              "space-md": "1rem",
              "space-lg": "1.5rem",
              "gutter": "1rem",
              "space-xs": "0.25rem",
              "margin-desktop": "2rem",
              "gutter-desktop": "1.5rem",
              "margin": "1rem",
              "space-xl": "2rem",
              "space-sm": "0.5rem"
            },
            "fontFamily": {
              "headline-lg": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "headline-sm": ["Inter", "sans-serif"],
              "headline-xl": ["Inter", "sans-serif"],
              "headline-md": ["Inter", "sans-serif"],
              "body-sm": ["Inter", "sans-serif"],
              "label-sm": ["Inter", "sans-serif"],
              "metric-display": ["Inter", "sans-serif"],
              "label-md": ["Inter", "sans-serif"]
            },
            "fontSize": {
              "headline-lg": ["1.5rem", { "lineHeight": "2rem", "letterSpacing": "-0.02em", "fontWeight": "600" }],
              "body-md": ["0.875rem", { "lineHeight": "1.375rem", "fontWeight": "400" }],
              "body-lg": ["1rem", { "lineHeight": "1.5rem", "fontWeight": "400" }],
              "headline-sm": ["1.125rem", { "lineHeight": "1.5rem", "letterSpacing": "-0.01em", "fontWeight": "500" }],
              "headline-xl": ["2rem", { "lineHeight": "2.5rem", "letterSpacing": "-0.025em", "fontWeight": "600" }],
              "headline-md": ["1.25rem", { "lineHeight": "1.75rem", "letterSpacing": "-0.015em", "fontWeight": "600" }],
              "body-sm": ["0.75rem", { "lineHeight": "1.125rem", "fontWeight": "400" }],
              "label-sm": ["0.75rem", { "lineHeight": "1rem", "letterSpacing": "0.02em", "fontWeight": "500" }],
              "metric-display": ["2rem", { "lineHeight": "2.25rem", "letterSpacing": "-0.03em", "fontWeight": "700" }],
              "label-md": ["0.875rem", { "lineHeight": "1.25rem", "fontWeight": "500" }]
            }
          }
        }
      };
    </script>
    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
          height: 100%;
        }
        body {
          overscroll-behavior: none;
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
      }
      /* Clean scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(109, 122, 119, 0.2);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(109, 122, 119, 0.4);
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-background font-body-md text-on-surface antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
